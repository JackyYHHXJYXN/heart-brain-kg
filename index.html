<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>医学知识图谱</title>
<meta name="description" content="依据最新国际与中国指南整理的医学科普知识图谱合集，每个知识点附权威文献与视频。">
<meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121316" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="stroke-mi/icon.svg" type="image/svg+xml">
<link rel="canonical" href="https://jackyyhhxjyxn.github.io/heart-brain-kg/">
<meta property="og:type" content="website">
<meta property="og:title" content="医学知识图谱">
<meta property="og:description" content="依据最新国际与中国指南整理的医学科普知识图谱合集。">
<meta property="og:url" content="https://jackyyhhxjyxn.github.io/heart-brain-kg/">
<style>
:root{--bg:#f6f5f2;--surface:#fff;--line:#e2dfd8;--text:#1b1c1f;--muted:#6a6c72}
@media (prefers-color-scheme:dark){:root{--bg:#121316;--surface:#1b1c20;--line:#2c2e34;--text:#ecebe8;--muted:#9b9da4}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;padding:max(20px,env(safe-area-inset-top)) 16px max(28px,env(safe-area-inset-bottom))}
main{max-width:640px;margin:0 auto}
h1{font-size:1.6rem;margin:12px 0 4px}
.sub{color:var(--muted);margin:0 0 20px}
.g{display:grid;gap:12px}
.card{display:flex;gap:14px;align-items:flex-start;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:14px;padding:16px}
.card .ic{font-size:2rem;line-height:1}
.card b{display:block;font-size:1.1rem}
.card span.d{color:var(--muted);font-size:.92rem}
.card.soon{opacity:.55;pointer-events:none}
.tag{display:inline-block;font-size:.75rem;border:1px solid var(--line);border-radius:99px;padding:0 8px;margin-left:8px;color:var(--muted)}
.note{color:var(--muted);font-size:.85rem;margin-top:24px}
</style>
</head>
<body>
<main>
  <h1>医学知识图谱</h1>
  <p class="sub">最新指南 · 权威文献 · 手机即开即用</p>
  <div class="g" id="g"></div>
  <p class="note"><b>免责声明：</b>本站仅用于健康科普，不能替代医生的诊断和治疗。出现急症请立即呼叫急救。</p>
</main>
<noscript><p style="padding:16px">请启用 JavaScript。</p></noscript>
<script src="registry.js"></script>
<script>
(function(){
  /* 兼容旧分享链接：根目录 #/k/ivt 等一律跳到心梗·脑梗图谱 */
  if (/^#\/./.test(location.hash)) { location.replace("stroke-mi/" + location.hash); return; }
  var esc = function(s){ return String(s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); };
  document.getElementById("g").innerHTML = window.REGISTRY.map(function(r){
    var live = r.status === "live";
    return '<a class="card' + (live ? "" : " soon") + '" style="--c:' + esc(r.color) + '"' + (live ? ' href="' + esc(r.id) + '/"' : "") + '>' +
      '<span class="ic" aria-hidden="true">' + r.icon + '</span><span><b>' + esc(r.title) + (live ? "" : '<span class="tag">筹备中</span>') + '</b><span class="d">' + esc(r.desc) + '</span></span></a>';
  }).join("");
})();
</script>
</body>
</html>
