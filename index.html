<style>
:root{
  --bg:#f6f5f2; --surface:#ffffff; --surface-2:#efede8; --line:#e2dfd8;
  --ink:#1b1c1f; --ink-2:#4b4d53; --ink-3:#74767c;
  --accent:#1f5fbf; --sos:#c8102e; --sos-ink:#fff; --sos-soft:#fdecee;
  --ok:#1d7a4f; --warn:#a15c00; --bad:#b3261e;
  --c-base:#2f63c8; --c-risk:#a8650b; --c-sign:#c43d34; --c-aid:#b0236a;
  --c-mi:#6d4bd1; --c-st:#0f7f84; --c-prev:#2c7a46; --c-tool:#5d6470;
  --radius:16px; --shadow:0 1px 2px rgba(20,20,30,.06),0 4px 16px rgba(20,20,30,.05);
  --nav-h:64px; --bar-h:56px;
  --fs:17px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121316; --surface:#1c1d21; --surface-2:#25262b; --line:#33353b;
    --ink:#ecebe8; --ink-2:#b9b9bd; --ink-3:#8c8d93;
    --accent:#7aa7ff; --sos:#ff4d5e; --sos-ink:#1a0003; --sos-soft:#3a1519;
    --ok:#5cc98f; --warn:#f0a845; --bad:#ff7a6e;
    --c-base:#7aa2ff; --c-risk:#e3a447; --c-sign:#ff7b6f; --c-aid:#f07ab3;
    --c-mi:#a991ff; --c-st:#4fc7cb; --c-prev:#6fcf8f; --c-tool:#a5abb5;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#121316; --surface:#1c1d21; --surface-2:#25262b; --line:#33353b;
  --ink:#ecebe8; --ink-2:#b9b9bd; --ink-3:#8c8d93;
  --accent:#7aa7ff; --sos:#ff4d5e; --sos-ink:#1a0003; --sos-soft:#3a1519;
  --ok:#5cc98f; --warn:#f0a845; --bad:#ff7a6e;
  --c-base:#7aa2ff; --c-risk:#e3a447; --c-sign:#ff7b6f; --c-aid:#f07ab3;
  --c-mi:#a991ff; --c-st:#4fc7cb; --c-prev:#6fcf8f; --c-tool:#a5abb5;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}
:root[data-fs="1"]{--fs:19px} :root[data-fs="2"]{--fs:21px}
*{box-sizing:border-box}
html{font-size:var(--fs);-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Source Han Sans SC",system-ui,sans-serif;
  line-height:1.65;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));min-height:100vh}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wx-thumb{position:absolute;width:0;height:0;overflow:hidden;opacity:0}

/* app bar */
.bar{position:sticky;top:0;z-index:20;height:calc(var(--bar-h) + env(safe-area-inset-top));padding:env(safe-area-inset-top) 8px 0 16px;
  display:flex;align-items:center;gap:8px;background:color-mix(in srgb,var(--bg) 88%,transparent);
  -webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid transparent}
.bar.scrolled{border-bottom-color:var(--line)}
.bar h1{font-size:1.05rem;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700;letter-spacing:.01em}
.bar .back{display:none}
.bar.has-back .back{display:inline-flex}
.icon-btn{width:44px;height:44px;border:0;background:transparent;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.icon-btn:active{background:var(--surface-2)}
.icon-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(4,1fr);
  height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);
  background:color-mix(in srgb,var(--surface) 92%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line)}
.nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none;color:var(--ink-3);font-size:.68rem;font-weight:600}
.nav a svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav a[aria-current="page"]{color:var(--ink)}
.nav a.sos{color:var(--sos)}
.nav a.sos[aria-current="page"]{color:var(--sos)}

main{max-width:760px;margin:0 auto;padding:8px 16px 32px}
.view{display:none;animation:fade .22s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
.stack>*+*{margin-top:12px}
h2{font-size:1.15rem;margin:28px 0 10px;line-height:1.35}
h3{font-size:1rem;margin:0 0 6px;line-height:1.4}
.muted{color:var(--ink-3)} .small{font-size:.82rem}
.eyebrow{font-size:.74rem;font-weight:700;letter-spacing:.06em;color:var(--ink-3);text-transform:uppercase}

/* home */
.sos-banner{display:flex;align-items:center;gap:12px;background:var(--sos);color:var(--sos-ink);text-decoration:none;border-radius:var(--radius);padding:14px 16px;font-weight:700;min-height:64px}
.sos-banner .big{font-size:1.05rem;line-height:1.3}
.sos-banner .sub{font-size:.78rem;font-weight:500;opacity:.92}
.sos-banner .go{margin-left:auto;font-size:1.4rem}
.hero{padding:20px 4px 4px}
.hero .title{font-size:1.7rem;font-weight:800;line-height:1.2;margin:0 0 8px;letter-spacing:-.01em}
.hero p{margin:0;color:var(--ink-2)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stat b{display:block;font-size:1.35rem;line-height:1.2;font-variant-numeric:tabular-nums}
.stat span{font-size:.78rem;color:var(--ink-2);line-height:1.4;display:block;margin-top:2px}
.timeline{list-style:none;margin:0;padding:0;position:relative}
.timeline li{position:relative;padding:0 0 14px 26px}
.timeline li:last-child{padding-bottom:0}
.timeline li::before{content:"";position:absolute;left:6px;top:8px;width:10px;height:10px;border-radius:50%;background:var(--dot,var(--accent))}
.timeline li::after{content:"";position:absolute;left:10px;top:20px;bottom:-6px;width:2px;background:var(--line)}
.timeline li:last-child::after{display:none}
.timeline b{font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:6px;background:var(--surface-2);padding:4px;border-radius:12px}
.tabs button{flex:1;border:0;background:transparent;padding:9px 6px;border-radius:9px;font-weight:600;font-size:.88rem;cursor:pointer;color:var(--ink-2);min-height:40px}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cat-tile{display:flex;flex-direction:column;gap:4px;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;min-height:96px;position:relative;overflow:hidden}
.cat-tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--cc)}
.cat-tile .ic{font-size:1.4rem;line-height:1}
.cat-tile b{font-size:.95rem}
.cat-tile span{font-size:.75rem;color:var(--ink-3)}
.note{font-size:.8rem;color:var(--ink-3);line-height:1.6}

/* learn */
.search{position:sticky;top:calc(var(--bar-h) + env(safe-area-inset-top));z-index:10;background:var(--bg);padding:8px 0 6px;margin:0 -16px;padding-left:16px;padding-right:16px}
.search label{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px;min-height:46px}
.search svg{width:18px;height:18px;stroke:var(--ink-3);fill:none;stroke-width:2;flex:none}
.search input{flex:1;border:0;background:transparent;font:inherit;color:var(--ink);min-width:0;padding:10px 0;font-size:max(16px,1rem)}
.search input:focus{outline:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 16px 4px;margin:0 -16px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:.84rem;font-weight:600;cursor:pointer;min-height:38px;color:var(--ink-2);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--cc);margin-right:6px;vertical-align:1px}
.group-h{display:flex;align-items:center;gap:8px;margin:22px 0 8px;font-size:.86rem;font-weight:700;color:var(--ink-2)}
.group-h i{width:10px;height:10px;border-radius:3px;background:var(--cc)}
.list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.list li+li{border-top:1px solid var(--line)}
.list a{display:flex;align-items:center;gap:12px;padding:13px 14px;text-decoration:none;color:var(--ink);min-height:60px}
.list a:active{background:var(--surface-2)}
.list .tx{flex:1;min-width:0}
.list .tt{font-weight:650;font-size:.96rem;line-height:1.4}
.list .ss{font-size:.8rem;color:var(--ink-3);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:2px}
.chev{width:18px;height:18px;stroke:var(--ink-3);fill:none;stroke-width:2;flex:none}
mark{background:color-mix(in srgb,var(--c-risk) 30%,transparent);color:inherit;border-radius:3px;padding:0 1px}
.empty{text-align:center;padding:40px 16px;color:var(--ink-3)}

/* detail */
.d-head{padding:14px 2px 4px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:.74rem;font-weight:700;color:var(--cc);background:color-mix(in srgb,var(--cc) 12%,transparent);padding:4px 10px;border-radius:999px;text-decoration:none}
.d-title{font-size:1.5rem;font-weight:800;line-height:1.28;margin:10px 0 2px;letter-spacing:-.01em}
.d-en{color:var(--ink-3);font-size:.86rem;margin:0}
.d-lead{font-size:1.04rem;line-height:1.7;margin:14px 0 0;padding:12px 14px;border-left:4px solid var(--cc);background:var(--surface);border-radius:0 12px 12px 0}
.nums{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.num{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.num b{display:block;font-size:1.2rem;line-height:1.25;color:var(--cc);font-variant-numeric:tabular-nums;word-break:break-word}
.num span{display:block;font-size:.8rem;color:var(--ink-2);line-height:1.45;margin-top:4px}
.prose p{margin:0 0 12px}
.keys{list-style:none;margin:0;padding:0}
.keys li{position:relative;padding:8px 0 8px 28px;border-top:1px dashed var(--line)}
.keys li:first-child{border-top:0}
.keys li::before{content:"";position:absolute;left:4px;top:15px;width:12px;height:7px;border-left:2.5px solid var(--ok);border-bottom:2.5px solid var(--ok);transform:rotate(-45deg)}
.myth{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
.myth+.myth{margin-top:8px}
.myth .q{padding:10px 14px;background:color-mix(in srgb,var(--bad) 9%,transparent);font-weight:650;font-size:.92rem}
.myth .q::before{content:"✗ 误区　";color:var(--bad)}
.myth .a{padding:10px 14px;font-size:.92rem}
.myth .a::before{content:"✓ 事实　";color:var(--ok);font-weight:700}
.rel{display:flex;flex-wrap:wrap;gap:8px}
.rel a{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:.84rem;min-height:38px}
.rel a i{width:8px;height:8px;border-radius:50%;background:var(--cc);flex:none}
.links{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.links li+li{border-top:1px solid var(--line)}
.links a{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;text-decoration:none;color:var(--ink);min-height:56px}
.links a:active{background:var(--surface-2)}
.links .k{flex:none;font-size:.68rem;font-weight:800;letter-spacing:.03em;padding:3px 7px;border-radius:6px;margin-top:2px;background:var(--surface-2);color:var(--ink-2);min-width:44px;text-align:center}
.links .k.doi{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
.links .k.bili{background:#fb729922;color:#d6336c}
.links .k.yt{background:#ff000018;color:#d40000}
:root[data-theme="dark"] .links .k.bili,:root[data-theme="dark"] .links .k.yt{color:#ff8fa8}
.links .tt{font-size:.9rem;font-weight:600;line-height:1.45}
.links .src{font-size:.76rem;color:var(--ink-3);margin-top:2px;word-break:break-all}
.ext{width:14px;height:14px;stroke:var(--ink-3);fill:none;stroke-width:2;flex:none;margin-top:5px;margin-left:auto}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:24px}
.pager a{display:block;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;min-height:64px}
.pager a small{display:block;color:var(--ink-3);font-size:.74rem}
.pager a span{font-size:.88rem;font-weight:600;line-height:1.4;display:block}
.pager a.next{text-align:right}
.calc label{display:flex;align-items:center;gap:12px;padding:10px 4px;border-top:1px dashed var(--line);cursor:pointer;min-height:48px;font-size:.92rem}
.calc label:first-of-type{border-top:0}
.calc input{width:22px;height:22px;accent-color:var(--cc);flex:none}
.calc .pts{margin-left:auto;color:var(--ink-3);font-variant-numeric:tabular-nums;font-size:.82rem}
.calc .res{margin-top:10px;padding:12px 14px;border-radius:12px;font-weight:700;display:flex;align-items:baseline;gap:10px}
.calc .res b{font-size:1.6rem;font-variant-numeric:tabular-nums}
.res.low{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
.res.mid{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.res.high{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}

/* graph */
.g-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;position:relative}
.g-ego svg{display:block;width:100%;height:auto;max-height:62vh;touch-action:manipulation}
.g-ego .edge{stroke:var(--line);stroke-width:1.5}
.g-node{cursor:pointer}
.g-node circle{transition:transform .2s}
.g-node text{font-size:11px;fill:var(--ink);text-anchor:middle;font-weight:600;pointer-events:none}
.g-node.center text{font-size:13px;font-weight:800}
.g-node:focus-visible circle.ring{stroke:var(--accent);stroke-width:3}
.g-crumbs{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:.8rem;padding:10px 12px 0;color:var(--ink-3)}
.g-crumbs button{border:0;background:var(--surface-2);border-radius:999px;padding:4px 10px;cursor:pointer;font-size:.78rem;color:var(--ink-2);min-height:32px}
.g-card{margin-top:12px}
.g-card .actions{display:flex;gap:10px;margin-top:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:11px 16px;font-weight:700;cursor:pointer;text-decoration:none;min-height:46px;font-size:.92rem}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.sos{background:var(--sos);color:var(--sos-ink)}
.g-over{overflow:auto;-webkit-overflow-scrolling:touch;max-height:70vh;touch-action:pan-x pan-y}
.g-over svg{display:block}
.g-over .edge{stroke:var(--line);stroke-width:1.2}
.g-over .xedge{fill:none;stroke:var(--ink-3);stroke-opacity:.18;stroke-width:1;stroke-dasharray:3 4}
.g-over text{font-size:13px;fill:var(--ink);text-anchor:middle;font-weight:600;pointer-events:none}
.zoom{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:1.3rem;font-weight:700;box-shadow:var(--shadow);cursor:pointer}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.76rem;color:var(--ink-2);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:50%;background:var(--cc)}

/* sos */
.call{display:flex;align-items:center;justify-content:center;gap:12px;background:var(--sos);color:var(--sos-ink);text-decoration:none;border-radius:20px;padding:18px;font-size:1.5rem;font-weight:800;min-height:84px;box-shadow:0 6px 24px color-mix(in srgb,var(--sos) 35%,transparent)}
.call svg{width:30px;height:30px;stroke:currentColor;fill:none;stroke-width:2.2}
.other-nums{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;justify-content:center}
.other-nums a{font-size:.8rem;text-decoration:none;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px;min-height:36px;display:inline-flex;align-items:center}
.timer .clock{font-size:2.2rem;font-variant-numeric:tabular-nums;letter-spacing:.02em;display:block;line-height:1.2}
.timer .row{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.timer .row .btn{flex:1}
.win{margin-top:10px;font-size:.82rem}
.win span{display:inline-block;margin:2px 6px 2px 0;padding:3px 8px;border-radius:8px;background:var(--surface-2)}
.win span.pass{text-decoration:line-through;opacity:.55}
.steps{counter-reset:s;list-style:none;margin:0;padding:0}
.steps li{counter-increment:s;position:relative;padding:10px 0 10px 44px;border-top:1px dashed var(--line);min-height:44px}
.steps li:first-child{border-top:0}
.steps li::before{content:counter(s);position:absolute;left:0;top:9px;width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--bg);font-weight:800;display:flex;align-items:center;justify-content:center;font-size:.86rem}
.steps.red li::before{background:var(--sos);color:var(--sos-ink)}
.fast{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fast div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 8px;text-align:center}
.fast b{display:block;font-size:1.6rem;line-height:1.1;color:var(--sos)}
.fast span{font-size:.74rem;color:var(--ink-2);line-height:1.35;display:block;margin-top:4px}
.dont{list-style:none;margin:0;padding:0}
.dont li{padding:8px 0 8px 28px;position:relative;border-top:1px dashed var(--line)}
.dont li:first-child{border-top:0}
.dont li::before{content:"✕";position:absolute;left:4px;top:8px;color:var(--bad);font-weight:800}
.metro{display:flex;align-items:center;gap:16px}
.beat{width:72px;height:72px;border-radius:50%;background:var(--sos);flex:none;opacity:.25;transform:scale(.85);transition:opacity .08s,transform .08s}
.beat.on{opacity:1;transform:scale(1)}

.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 16px);transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.88rem;opacity:0;pointer-events:none;transition:.25s;z-index:50;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
.foot{margin-top:32px;padding-top:16px;border-top:1px solid var(--line)}
@media (min-width:700px){
  .stats{grid-template-columns:repeat(4,1fr)}
  .cat-grid{grid-template-columns:repeat(4,1fr)}
}
</style>

<body>

<noscript><p style="padding:16px">请启用 JavaScript 以使用本知识图谱。</p></noscript>
<script src="data.js"></script>
<script>
(function(){
"use strict";
const {CATS, NODES, REVIEWED} = window.KG;
const byId = Object.fromEntries(NODES.map(n => [n.id, n]));
const catById = Object.fromEntries(CATS.map(c => [c.id, c]));
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cc = c => `style="--cc:var(${catById[c].color})"`;
const store = {
  get(k){ try { return localStorage.getItem("kg:"+k); } catch(e){ return null; } },
  set(k,v){ try { v==null ? localStorage.removeItem("kg:"+k) : localStorage.setItem("kg:"+k, v); } catch(e){} }
};
const ICON = {
  chev:'<svg class="chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>',
  ext:'<svg class="ext" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 01-1 1H5a1 1 0 01-1-1V7a1 1 0 011-1h5"/></svg>',
  phone:'<svg viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 01-2.2 2 19.8 19.8 0 01-8.6-3.1 19.5 19.5 0 01-6-6A19.8 19.8 0 012.1 4.2 2 2 0 014.1 2h3a2 2 0 012 1.7c.1.9.4 1.8.7 2.7a2 2 0 01-.5 2.1L8 9.8a16 16 0 006 6l1.3-1.3a2 2 0 012.1-.4c.9.3 1.8.6 2.7.7a2 2 0 011.7 2z"/></svg>'
};

/* incoming links: build bidirectional neighbour sets */
const nbr = {};
NODES.forEach(n => nbr[n.id] = new Set());
NODES.forEach(n => (n.r||[]).forEach(r => { if (byId[r]) { nbr[n.id].add(r); nbr[r].add(n.id); } }));

/* ---------- prefs ---------- */
const root = document.documentElement;
function applyPrefs(){
  const fs = store.get("fs"); fs && fs !== "0" ? root.dataset.fs = fs : delete root.dataset.fs;
  const th = store.get("theme"); th ? root.dataset.theme = th : delete root.dataset.theme;
}
applyPrefs();
$("#fsBtn").onclick = () => { const v = ((+store.get("fs")||0)+1)%3; store.set("fs", String(v)); applyPrefs(); toast(["标准字号","大字号","特大字号"][v]); };
$("#themeBtn").onclick = () => {
  const order = [null,"light","dark"], cur = store.get("theme"), nx = order[(order.indexOf(cur)+1)%3];
  store.set("theme", nx); applyPrefs(); toast({null:"跟随系统","light":"浅色模式","dark":"深色模式"}[nx]);
};
let toastT;
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("on"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("on"),2000); }

async function share(title, text){
  const url = location.href;
  if (navigator.share) { try { await navigator.share({title, text, url}); return; } catch(e){ if (e && e.name==="AbortError") return; } }
  try { await navigator.clipboard.writeText(title+"\n"+url); toast("链接已复制，可粘贴到微信、微博等"); }
  catch(e){ prompt("复制以下链接分享：", url); }
}
$("#shareBtn").onclick = () => {
  const n = currentNode && byId[currentNode];
  share(n ? n.t+" | 心梗·脑梗知识图谱" : "心梗·脑梗知识图谱", n ? n.s : "早识别、快急救、防复发");
};
window.addEventListener("scroll", () => $("#bar").classList.toggle("scrolled", scrollY > 4), {passive:true});

/* ---------- HOME ---------- */
function renderHome(){
  const counts = {}; NODES.forEach(n => counts[n.c]=(counts[n.c]||0)+1);
  $("#v-home").innerHTML = `
  <a class="sos-banner" href="#/sos">
    <div><div class="big">胸痛不缓解？口角歪斜、手臂无力？</div><div class="sub">立即拨打当地急救电话 · 打开一键急救指引</div></div><span class="go" aria-hidden="true">›</span>
  </a>
  <div class="hero">
    <p class="eyebrow">时间就是心肌 · 时间就是大脑</p>
    <p class="title">心梗·脑梗<br>知识图谱</p>
    <p>${NODES.length} 个知识点，按照 2023–2026 年美国、欧洲与中国最新指南整理。每一条都附有权威文献和视频讲解。</p>
  </div>
  <div class="stats">
    <div class="stat"><b>190万</b><span>大血管闭塞时，每分钟死亡的神经元</span></div>
    <div class="stat"><b>4.5 小时</b><span>脑梗：静脉溶栓的标准时间窗</span></div>
    <div class="stat"><b>24 小时</b><span>脑梗：影像筛选后取栓的时间窗</span></div>
  </div>

  <h2>抢救的时间线</h2>
  <div class="card">
    <div class="tabs" role="tablist" id="tlTabs">
      <button role="tab" aria-selected="true" data-tl="mi">心梗</button>
      <button role="tab" aria-selected="false" data-tl="st">脑梗</button>
    </div>
    <div id="tlBody" style="margin-top:14px"></div>
  </div>

  <h2>八大知识模块</h2>
  <div class="cat-grid">
    ${CATS.map(c => `<a class="cat-tile" href="#/learn/${c.id}" ${cc(c.id)}><span class="ic" aria-hidden="true">${c.icon}</span><b>${c.t}</b><span>${counts[c.id]||0} 个知识点 · ${c.e}</span></a>`).join("")}
  </div>

  <h2>今天就能做的 5 件事</h2>
  <div class="card"><ol class="steps">
    <li>教会家人 <a href="#/k/befast">BE FAST</a> 或 <a href="#/k/s120">中风120</a> 口诀，并记住急救电话。</li>
    <li>测一次血压，查一次血脂。成年后至少查一次 <a href="#/k/lpa">脂蛋白(a)</a>。</li>
    <li>如果吸烟，今天就开始 <a href="#/k/smoke">戒烟</a>。</li>
    <li>每周累计 150 分钟快走，饮食少盐。参考 <a href="#/k/le8">生命八要素</a>。</li>
    <li>学习 <a href="#/k/cpr">心肺复苏和 AED</a>，记住你常去地方的 AED 位置。</li>
  </ol></div>

  <div class="foot note">
    <p><b>免责声明：</b>本站仅用于健康科普，不能替代医生的诊断和治疗。出现症状请立即呼叫急救。用药请遵医嘱。</p>
    <p>内容核对：${REVIEWED}。主要依据：2026 AHA/ASA 急性缺血性卒中指南、2025 ACC/AHA 急性冠脉综合征指南、2025 AHA/ACC 高血压指南、2023 ESC 急性冠脉综合征指南、2024 ESC 房颤/慢性冠脉综合征/高血压指南、2025 ESC/EAS 血脂更新、《中国急性缺血性卒中诊治指南2023》。</p>
  </div>`;
  const TL = {
    mi: [["0 分钟","出现胸痛或胸闷，持续超过5分钟","--c-sign"],["立即","拨打当地急救电话，停止活动；在指导下嚼服阿司匹林","--c-aid"],["出院前","双抗、强化降脂、心脏康复转诊","--c-prev"]],
    st: [["0 分钟","突发面瘫、肢体无力、言语不清；记下最后正常时间","--c-sign"],["立即","拨打当地急救电话，不要喂水喂药","--c-aid"],["≤24 小时","大血管闭塞：影像筛选后取栓","--c-st"],["住院期间","病因评估、二级预防、早期康复","--c-prev"]]
  };
  const tl = k => { $("#tlBody").innerHTML = `<ul class="timeline">${TL[k].map(([t,d,c])=>`<li style="--dot:var(${c})"><b>${t}</b><br><span class="muted small">${d}</span></li>`).join("")}</ul>
    <p style="margin:12px 0 0"><a href="#/k/${k==="mi"?"pci":"ivt"}">了解${k==="mi"?"直接PCI":"静脉溶栓"} →</a></p>`; };
  $("#tlTabs").onclick = e => { const b=e.target.closest("button"); if(!b) return; $("#tlTabs").querySelectorAll("button").forEach(x=>x.setAttribute("aria-selected", x===b)); tl(b.dataset.tl); };
  tl("mi");
}

/* ---------- LEARN ---------- */
let learnCat = "all", learnQ = "";
function renderLearnShell(){
  $("#v-learn").innerHTML = `
    <div class="search"><label><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <span class="sr">搜索知识点</span><input id="q" type="search" enterkeyhint="search" placeholder="搜索：溶栓、阿司匹林、血压…" autocomplete="off"></label>
      <div class="chips" id="chips" role="toolbar" aria-label="按分类筛选">
        <button class="chip" data-c="all" aria-pressed="true">全部</button>
        ${CATS.map(c=>`<button class="chip" data-c="${c.id}" ${cc(c.id)} aria-pressed="false"><span class="dot"></span>${c.t}</button>`).join("")}
      </div>
    </div>
    <div id="learnList"></div>`;
  const q = $("#q");
  q.addEventListener("input", () => { learnQ = q.value.trim(); renderLearnList(); });
  $("#chips").onclick = e => { const b=e.target.closest(".chip"); if(!b) return; setCat(b.dataset.c); history.replaceState(null,"", b.dataset.c==="all"?"#/learn":"#/learn/"+b.dataset.c); };
}
function setCat(c){
  learnCat = catById[c] ? c : "all";
  document.querySelectorAll("#chips .chip").forEach(x => x.setAttribute("aria-pressed", x.dataset.c===learnCat));
  const on = $(`#chips .chip[data-c="${learnCat}"]`); on && on.scrollIntoView({block:"nearest",inline:"center"});
  renderLearnList();
}
function hay(n){ return [n.t,n.en,n.s,...(n.d||[]),...(n.k||[]),...(n.n||[]).flat()].join(" ").toLowerCase(); }
const HAY = Object.fromEntries(NODES.map(n=>[n.id,hay(n)]));
function hl(text){ if(!learnQ) return esc(text); const i=text.toLowerCase().indexOf(learnQ.toLowerCase()); if(i<0) return esc(text); return esc(text.slice(0,i))+"<mark>"+esc(text.slice(i,i+learnQ.length))+"</mark>"+esc(text.slice(i+learnQ.length)); }
function renderLearnList(){
  const terms = learnQ.toLowerCase().split(/\s+/).filter(Boolean);
  const hits = NODES.filter(n => (learnCat==="all"||n.c===learnCat) && terms.every(t => HAY[n.id].includes(t)));
  if (!hits.length) { $("#learnList").innerHTML = `<div class="empty">没有找到与“${esc(learnQ)}”相关的知识点。<br>试试“血压”“溶栓”“支架”。</div>`; return; }
  const html = CATS.filter(c => hits.some(n=>n.c===c.id)).map(c => `
    <div class="group-h" ${cc(c.id)}><i></i>${c.t}<span class="muted small" style="font-weight:500">· ${hits.filter(n=>n.c===c.id).length}</span></div>
    <ul class="list">${hits.filter(n=>n.c===c.id).map(n=>`<li><a href="#/k/${n.id}"><div class="tx"><div class="tt">${hl(n.t)}</div><div class="ss">${hl(n.s)}</div></div>${ICON.chev}</a></li>`).join("")}</ul>`).join("");
  $("#learnList").innerHTML = (learnQ?`<p class="muted small" style="margin:12px 2px 0">找到 ${hits.length} 个结果</p>`:"") + html;
}

/* ---------- DETAIL ---------- */
let currentNode = null;
const host = u => { try { return new URL(u).hostname.replace(/^www\./,""); } catch(e){ return ""; } };
function refKind(u){ const h=host(u); if(h==="doi.org") return ["doi","DOI"]; if(/pubmed|ncbi/.test(h)) return ["doi","PMC"]; if(/mdcalc/.test(h)) return ["","工具"]; return ["","官网"]; }
function renderDetail(id){
  const n = byId[id]; if (!n) { location.replace("#/learn"); return; }
  currentNode = id;
  const c = catById[n.c];
  const siblings = NODES.filter(x=>x.c===n.c), i = siblings.indexOf(n);
  const all = NODES.indexOf(n), prev = NODES[all-1], next = NODES[all+1];
  const rel = [...nbr[id]].map(r=>byId[r]);
  const videos = [];
  (n.vl||[]).forEach(([t,u,p]) => videos.push(`<li><a href="${esc(u)}" target="_blank" rel="noopener"><span class="k">${esc(p)}</span><div><div class="tt">${esc(t)}</div><div class="src">${esc(host(u))}</div></div>${ICON.ext}</a></li>`));
  (n.v||[]).forEach(([t,zh,en]) => {
    videos.push(`<li><a href="https://search.bilibili.com/all?keyword=${encodeURIComponent(zh)}" target="_blank" rel="noopener"><span class="k bili">B站</span><div><div class="tt">${esc(t)}</div><div class="src">哔哩哔哩搜索：${esc(zh)} · 建议优先选择医院、医生认证账号</div></div>${ICON.ext}</a></li>`);
    videos.push(`<li><a href="https://www.youtube.com/results?search_query=${encodeURIComponent(en)}" target="_blank" rel="noopener"><span class="k yt">YouTube</span><div><div class="tt">${esc(en)}</div><div class="src">YouTube搜索 · 建议选择 AHA、Mayo Clinic、NHS 等官方频道</div></div>${ICON.ext}</a></li>`);
  });
  $("#v-detail").innerHTML = `
  <div class="d-head" ${cc(n.c)}>
    <a class="badge" href="#/learn/${c.id}">${c.icon} ${c.t} · ${i+1}/${siblings.length}</a>
    <h2 class="d-title">${esc(n.t)}</h2>
    <p class="d-en">${esc(n.en)}</p>
    <p class="d-lead">${esc(n.s)}</p>
  </div>
  <div ${cc(n.c)}>
  ${n.n ? `<h2>关键数字</h2><div class="nums">${n.n.map(([a,b])=>`<div class="num"><b>${esc(a)}</b><span>${esc(b)}</span></div>`).join("")}</div>` : ""}
  <h2>详细解释</h2><div class="prose">${n.d.map(p=>`<p>${esc(p)}</p>`).join("")}</div>
  ${n.k ? `<h2>要点</h2><div class="card"><ul class="keys">${n.k.map(k=>`<li>${esc(k)}</li>`).join("")}</ul></div>` : ""}
  ${n.calc ? calcHTML(n) : ""}
  ${n.m ? `<h2>常见误区</h2>${n.m.map(([q,a])=>`<div class="myth"><div class="q">${esc(q)}</div><div class="a">${esc(a)}</div></div>`).join("")}` : ""}
  ${rel.length ? `<h2>关联知识</h2><div class="rel">${rel.map(r=>`<a href="#/k/${r.id}" ${cc(r.c)}><i></i>${esc(r.t)}</a>`).join("")}</div>
     <p style="margin:10px 0 0"><a href="#/graph/${n.id}">在知识图谱中查看关系 →</a></p>` : ""}
  <h2>权威资料</h2>
  <ul class="links">${n.ref.map(([t,u,s])=>{const [k,l]=refKind(u);return `<li><a href="${esc(u)}" target="_blank" rel="noopener"><span class="k ${k}">${l}</span><div><div class="tt">${esc(t)}</div><div class="src">${esc(s)} · ${esc(host(u))}</div></div>${ICON.ext}</a></li>`;}).join("")}</ul>
  ${videos.length ? `<h2>视频讲解</h2><ul class="links">${videos.join("")}</ul>
     <p class="note" style="margin-top:8px">视频链接指向官方页面或平台检索结果，以便始终看到最新内容。中国大陆用户建议使用B站。</p>` : ""}
  <div class="pager">
    ${prev?`<a href="#/k/${prev.id}"><small>‹ 上一条</small><span>${esc(prev.t)}</span></a>`:"<span></span>"}
    ${next?`<a class="next" href="#/k/${next.id}"><small>下一条 ›</small><span>${esc(next.t)}</span></a>`:"<span></span>"}
  </div>
  <p class="note foot">本条内容核对于 ${REVIEWED}，仅供科普参考，不能替代医生面诊。</p>
  </div>`;
  if (n.calc) bindCalc(n);
  document.title = n.t + " | 心梗·脑梗知识图谱";
}
function calcHTML(n){
  const k = n.calc;

let gMode = "ego", gStack = [];
const keyLabel = k => k==="root" ? "心梗·脑梗" : k.startsWith("c:") ? catById[k.slice(2)].t : byId[k.slice(2)].t;
const keyColor = k => k==="root" ? "--sos" : k.startsWith("c:") ? catById[k.slice(2)].color : catById[byId[k.slice(2)].c].color;
function egoNeighbours(k){
  if (k==="root") return CATS.map(c=>"c:"+c.id);
  if (k.startsWith("c:")) return ["root", ...NODES.filter(n=>n.c===k.slice(2)).map(n=>"n:"+n.id)];
  const id = k.slice(2);
  return ["c:"+byId[id].c, ...[...nbr[id]].map(r=>"n:"+r)];
}
function wrap(t, max){
  t = t.replace(/[（(].*$/,"").replace(/：.*$/,"");
  const out=[]; for(let i=0;i<t.length && out.length<2;i+=max) out.push(t.slice(i,i+max));
  if (t.length > max*2) out[1] = out[1].slice(0,max-1)+"…";
  return out;
}
function renderGraphShell(){
  $("#v-graph").innerHTML = `
    <div class="tabs" role="tablist" id="gTabs" style="margin-top:8px">

    <div id="gBody"></div>`;
  $("#gTabs").onclick = e => { const b=e.target.closest("button"); if(!b) return; gMode=b.dataset.m; $("#gTabs").querySelectorAll("button").forEach(x=>x.setAttribute("aria-selected",x===b)); drawGraph(); };
}
let gCenter = "root";
function drawGraph(){
  $("#gHint").textContent = gMode==="ego" ? "点击任意节点，以它为中心展开关联知识。" : "双指或按钮缩放，拖动浏览。点击节点进入关系探索。";
  gMode==="ego" ? drawEgo() : drawAll();
}
function nodeSVG(k, x, y, r, isCenter){
  const lines = wrap(keyLabel(k), isCenter?7:6);
  const fs = isCenter?13:11;
  const icon = k==="root" ? "🫀" : k.startsWith("c:") ? catById[k.slice(2)].icon : "";
  return `<g class="g-node${isCenter?" center":""}" data-k="${k}" transform="translate(${x.toFixed(1)},${y.toFixed(1)})" tabindex="0" role="button" aria-label="${esc(keyLabel(k))}">
    <circle class="ring" r="${r+4}" fill="none" stroke="transparent"/>
    <circle r="${r}" fill="var(${keyColor(k)})" ${isCenter?"":`fill-opacity=".9"`}/>
    ${icon?`<text y="${r*0.36}" style="font-size:${r*0.95}px">${icon}</text>`:`<circle r="${r*0.32}" fill="var(--surface)"/>`}
    <text y="${r+fs+3}" style="font-size:${fs}px">${lines.map((l,i)=>`<tspan x="0" dy="${i?fs*1.2:0}">${esc(l)}</tspan>`).join("")}</text>
  </g>`;
}
function drawEgo(){
  const k = gCenter, ns = egoNeighbours(k), N = ns.length;
  const W=380, H=380, cx=0, cy=-8;
  const two = N > 10;
  const pos = ns.map((nk,i)=>{ const a = -Math.PI/2 + i*2*Math.PI/N; const R = two ? (i%2?150:104) : 132; return [nk, cx+R*Math.cos(a), cy+R*Math.sin(a)]; });
  const crumbs = gStack.slice(-3).map(s=>`<button data-back="${s}">${esc(keyLabel(s).slice(0,8))}</button><span>›</span>`).join("");
  let center;
  if (k==="root") center = {t:"心梗·脑梗知识图谱", s:"从八大模块出发，逐层探索。每个节点都可以展开它的关联知识。", href:"#/learn"};
  else if (k.startsWith("c:")) { const c=catById[k.slice(2)]; center={t:c.icon+" "+c.t, s:`本模块共 ${N-1} 个知识点。点击节点查看它们之间的关系。`, href:"#/learn/"+c.id}; }
  else { const n=byId[k.slice(2)]; center={t:n.t, s:n.s, href:"#/k/"+n.id}; }
  $("#gBody").innerHTML = `
   <div class="g-wrap g-ego">
     <div class="g-crumbs">${gStack.length?crumbs:""}<span>${gStack.length?"":"起点"}</span></div>
     <svg viewBox="${-W/2} ${-H/2} ${W} ${H}" role="group" aria-label="${esc(keyLabel(k))} 的关联图">
       ${pos.map(([,x,y])=>`<line class="edge" x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}"/>`).join("")}
       ${pos.map(([nk,x,y])=>nodeSVG(nk,x,y,two?15:18,false)).join("")}
       ${nodeSVG(k,cx,cy,k.startsWith("n:")?26:30,true)}
     </svg>
   </div>
   <div class="card g-card">
     <h3>${esc(center.t)}</h3><p class="muted small" style="margin:0">${esc(center.s)}</p>
     <div class="actions">
       <a class="btn primary" href="${center.href}">${k.startsWith("n:")?"阅读详情":"查看列表"}</a>
       ${k!=="root"?`<button class="btn ghost" id="gUp">${gStack.length?"后退":"回到起点"}</button>`:""}
     </div>
   </div>`;
  const svg = $("#gBody svg");
  const go = nk => { if (nk===gCenter) { if (nk.startsWith("n:")) location.hash="#/k/"+nk.slice(2); return; } gStack.push(gCenter); gCenter=nk; history.replaceState(null,"", nk.startsWith("n:")?"#/graph/"+nk.slice(2):"#/graph"); drawEgo(); };
  svg.addEventListener("click", e => { const g=e.target.closest(".g-node"); g && go(g.dataset.k); });
  svg.addEventListener("keydown", e => { if ((e.key==="Enter"||e.key===" ") && e.target.closest(".g-node")) { e.preventDefault(); go(e.target.closest(".g-node").dataset.k); } });
  $("#gBody .g-crumbs").onclick = e => { const b=e.target.closest("button"); if(!b) return; const idx=gStack.lastIndexOf(b.dataset.back); gCenter=b.dataset.back; gStack=gStack.slice(0,idx); drawEgo(); };
  const up = $("#gUp"); if (up) up.onclick = () => { gCenter = gStack.pop() || "root"; drawEgo(); };
}
let gZoom = 1.6;
function drawAll(){
  const S=1000, C=S/2, parts=[];
  const cPos = {}, nPos = {};
  CATS.forEach((c,i)=>{ const a=-Math.PI/2+i*2*Math.PI/CATS.length; cPos[c.id]=[C+175*Math.cos(a), C+175*Math.sin(a), a]; });
  CATS.forEach(c=>{
    const list = NODES.filter(n=>n.c===c.id), m=list.length, [,,a0]=cPos[c.id], span=(2*Math.PI/CATS.length)*0.92;
    list.forEach((n,j)=>{ const a=a0-span/2+span*(j+.5)/m; const R=j%2?425:330; nPos[n.id]=[C+R*Math.cos(a), C+R*Math.sin(a)]; });
  });
  const seen=new Set();
  NODES.forEach(n=>nbr[n.id].forEach(r=>{ const key=[n.id,r].sort().join("|"); if(seen.has(key))return; seen.add(key); const [x1,y1]=nPos[n.id],[x2,y2]=nPos[r]; parts.push(`<path class="xedge" d="M${x1.toFixed(0)},${y1.toFixed(0)} Q${C},${C} ${x2.toFixed(0)},${y2.toFixed(0)}"/>`); }));
  CATS.forEach(c=>{ const [x,y]=cPos[c.id]; parts.push(`<line class="edge" x1="${C}" y1="${C}" x2="${x.toFixed(0)}" y2="${y.toFixed(0)}"/>`); });
  NODES.forEach(n=>{ const [x,y]=nPos[n.id],[cx,cy]=cPos[n.c]; parts.push(`<line class="edge" x1="${cx.toFixed(0)}" y1="${cy.toFixed(0)}" x2="${x.toFixed(0)}" y2="${y.toFixed(0)}"/>`); });
  NODES.forEach(n=>{ const [x,y]=nPos[n.id]; parts.push(nodeSVG("n:"+n.id,x,y,11,false)); });
  CATS.forEach(c=>{ const [x,y]=cPos[c.id]; parts.push(nodeSVG("c:"+c.id,x,y,24,false)); });
  parts.push(nodeSVG("root",C,C,34,true));
  $("#gBody").innerHTML = `
   <div class="g-wrap"><div class="g-over" id="gOver"><svg id="gAll" viewBox="0 0 ${S} ${S}" role="group" aria-label="全景知识图谱">${parts.join("")}</svg></div>
   <div class="zoom"><button id="zIn" aria-label="放大">+</button><button id="zOut" aria-label="缩小">−</button></div></div>
   <div class="legend">${CATS.map(c=>`<span ${cc(c.id)}><i></i>${c.t}</span>`).join("")}</div>`;
  const over=$("#gOver"), svg=$("#gAll");
  const setZ = (z, keepCenter=true) => {
    const w = over.clientWidth, cxr = keepCenter ? (over.scrollLeft + w/2)/(svg.clientWidth||w) : .5, cyr = keepCenter ? (over.scrollTop + over.clientHeight/2)/(svg.clientHeight||w) : .5;
    gZoom = Math.max(1, Math.min(4, z)); const px = Math.round(w*gZoom);
    svg.setAttribute("width", px); svg.setAttribute("height", px);
    over.scrollLeft = cxr*px - w/2; over.scrollTop = cyr*px - over.clientHeight/2;
  };
  setZ(gZoom, false);
  $("#zIn").onclick = () => setZ(gZoom*1.35); $("#zOut").onclick = () => setZ(gZoom/1.35);
  /* pinch zoom */
  let pd=0, pz=1;
  over.addEventListener("touchstart", e=>{ if(e.touches.length===2){ pd=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY); pz=gZoom; } }, {passive:true});
  over.addEventListener("touchmove", e=>{ if(e.touches.length===2 && pd){ e.preventDefault(); const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY); setZ(pz*d/pd); } }, {passive:false});
  over.addEventListener("touchend", ()=>{ pd=0; });
  svg.addEventListener("click", e => { const g=e.target.closest(".g-node"); if(!g) return; gStack=[]; gCenter=g.dataset.k; gMode="ego"; $("#gTabs").querySelectorAll("button").forEach(x=>x.setAttribute("aria-selected",x.dataset.m==="ego")); drawGraph(); scrollTo(0,0); });
}

      <li>双手掌根叠放在<b>胸部正中</b>，双臂伸直，垂直向下按压。</li>
      <li>按压深度 <b>5–6 cm</b>，频率 <b>100–120 次/分</b>。每次按压后让胸廓完全回弹，尽量不要中断。</li>
      <li>AED 一到立即打开，按语音提示贴电极片、电击，然后马上继续按压。</li></ol></div>
    <div class="card" style="margin-top:12px"><h3>按压节拍器 · 110 次/分</h3>
      <div class="metro"><div class="beat" id="beat" aria-hidden="true"></div>
      <div style="flex:1"><p class="small muted" style="margin:0 0 10px">跟着闪烁和提示音按压。可以把手机放在旁边。</p>
      <button class="btn sos" id="mBtn" style="width:100%">开始节拍</button></div></div></div>
    <p style="margin:12px 2px 0"><a href="#/k/cpr">CPR 与 AED 详解、视频 →</a></p>`;
    $("#mBtn").onclick = () => metro ? stopMetro() : startMetro();
  }
}
function startMetro(){
  try { actx = actx || new (window.AudioContext||window.webkitAudioContext)(); actx.resume && actx.resume(); } catch(e){ actx = null; }
  const beat = $("#beat"), btn = $("#mBtn"); btn.textContent = "停止节拍";
  const one = () => {
    beat.classList.add("on"); setTimeout(()=>beat.classList.remove("on"), 120);
    if (actx) { const o=actx.createOscillator(), g=actx.createGain(); o.frequency.value=880; g.gain.setValueAtTime(.25,actx.currentTime); g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+.08); o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime+.09); }
    if (navigator.vibrate) navigator.vibrate(30);
  };
  one(); metro = setInterval(one, 60000/110);
}
function stopMetro(){ clearInterval(metro); metro = null; const b=$("#mBtn"); if (b) b.textContent="开始节拍"; }

/* ---------- ROUTER ---------- */
const scrollMem = {};
let lastKey = null, navDepth = 0;
function route(){
  const h = location.hash.replace(/^#\/?/,"");
  const [seg, arg] = h.split("/");
  if (lastKey) scrollMem[lastKey] = scrollY;
  let view = "home", title = "心梗·脑梗知识图谱", tab = "home";
  currentNode = null;
  if (seg==="k" && byId[arg]) { view="detail"; renderDetail(arg); title=catById[byId[arg].c].t; tab="learn"; }
  else if (seg==="learn") { view="learn"; tab="learn"; title="知识库"; if(!$("#q")) renderLearnShell(); setCat(arg||"all"); }
  else if (seg==="graph") { view="graph"; tab="graph"; title="知识图谱"; if(!$("#gTabs")) renderGraphShell(); if (arg && byId[arg]) { if (gCenter!=="n:"+arg) { gStack.push(gCenter); gCenter="n:"+arg; } gMode="ego"; $("#gTabs").querySelectorAll("button").forEach(x=>x.setAttribute("aria-selected",x.dataset.m==="ego")); } drawGraph(); }
  else if (seg==="sos") { view="sos"; tab="sos"; title="一键急救"; renderSOS(); }
  if (view!=="sos") { stopMetro(); clearInterval(tick); }
  if (view!=="detail") document.title = view==="home" ? "心梗·脑梗知识图谱" : title+" | 心梗·脑梗知识图谱";
  document.querySelectorAll(".view").forEach(v => v.classList.toggle("on", v.id==="v-"+view));
  document.querySelectorAll(".nav a").forEach(a => a.dataset.tab===tab ? a.setAttribute("aria-current","page") : a.removeAttribute("aria-current"));
  $("#barTitle").textContent = title;
  $("#bar").classList.toggle("has-back", view==="detail");
  const key = location.hash || "#/";
  lastKey = key;
  scrollTo(0, view==="detail" ? 0 : (scrollMem[key]||0));
}
$("#backBtn").onclick = () => navDepth > 1 ? history.back() : (location.hash = "#/learn");
window.addEventListener("hashchange", () => { navDepth++; route(); });
renderHome();
route(); navDepth = 1;

if ("serviceWorker" in navigator && location.protocol === "https:") {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
})();
</script>
