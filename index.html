<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>医学知识图谱</title>
<meta name="description" content="依据最新国际与中国指南整理的医学科普知识图谱合集，每个知识点附权威出处。无广告、无追踪。">
<meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121316" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="format-detection" content="telephone=no">
<link rel="icon" href="stroke-mi/icon.svg" type="image/svg+xml">
<link rel="canonical" href="https://jackyyhhxjyxn.github.io/heart-brain-kg/">
<meta property="og:type" content="website">
<meta property="og:title" content="医学知识图谱">
<meta property="og:description" content="依据最新国际与中国指南整理的医学科普知识图谱合集，每条附出处。">
<meta property="og:url" content="https://jackyyhhxjyxn.github.io/heart-brain-kg/">
<link rel="stylesheet" href="shared/app.css">
<script>
/* 兼容旧分享链接：根目录 #/k/ivt 等一律跳到心梗·脑梗图谱（要在页面渲染前执行） */
if (/^#\/./.test(location.hash)) location.replace("stroke-mi/" + location.hash);
</script>
</head>
<body class="site">
<header class="bar" id="bar">
  <h1>医学知识图谱</h1>
  <button class="icon-btn" id="fsBtn" aria-label="调整字号"><svg viewBox="0 0 24 24"><path d="M4 18L9 6l5 12M5.6 14h6.8M15 18l3-7 3 7M15.9 16h4.2"/></svg></button>
  <button class="icon-btn" id="themeBtn" aria-label="切换深浅色"><svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg></button>
</header>
<main>
  <div class="sos-strip" role="region" aria-label="急救">
    <div class="tx">胸痛不缓解？口角歪斜、手臂无力？<small><a href="stroke-mi/#/sos">打开急救指引 ›</a></small></div>
    <a class="call-s" href="stroke-mi/#/sos"><svg viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 01-2.2 2 19.8 19.8 0 01-8.6-3.1 19.5 19.5 0 01-6-6A19.8 19.8 0 012.1 4.2 2 2 0 014.1 2h3a2 2 0 012 1.7c.1.9.4 1.8.7 2.7a2 2 0 01-.5 2.1L8 9.8a16 16 0 006 6l1.3-1.3a2 2 0 012.1-.4c.9.3 1.8.6 2.7.7a2 2 0 011.7 2z"/></svg>当地急救电话</a>
  </div>

  <div class="site-hero">
    <h2>看得懂、有出处的<br>健康知识</h2>
    <p>依据最新指南整理，每一条都附权威出处。无广告、无追踪。</p>
  </div>

  <div class="gsearch" role="search">
    <label><span id="sIc"></span><span class="sr">搜索全站知识点</span>
      <input id="gq" type="search" enterkeyhint="search" placeholder="搜索：胸痛、溶栓、血压…" autocomplete="off"></label>
    <div id="gres" aria-live="polite"></div>
  </div>

  <div id="cont"></div>

  <h2>知识图谱</h2>
  <div class="domains" id="domains"></div>

  <h2>我们怎么写</h2>
  <div class="card"><ul class="how" id="how"></ul></div>

  <div class="foot note site-foot" id="foot">
    <p><b>免责声明：</b>本站仅用于健康科普，不能替代医生的诊断和治疗。出现急症请立即呼叫急救。</p>
  </div>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<noscript><p style="padding:16px">请启用 JavaScript。</p></noscript>
<script src="shared/icons.js"></script>
<script src="registry.js"></script>
<script src="shared/site-meta.js"></script>
<script>
(function(){
  "use strict";
  var $ = function(s){ return document.querySelector(s); };
  var esc = function(s){ return String(s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); };
  var get = function(k){ try { return localStorage.getItem("kg:" + k); } catch(e){ return null; } };
  var set = function(k, v){ try { v == null ? localStorage.removeItem("kg:" + k) : localStorage.setItem("kg:" + k, v); } catch(e){} };
  var IC = window.KG_ICON || function(){ return ""; };
  var root = document.documentElement, toastT;
  function toast(m){ var t = $("#toast"); t.textContent = m; t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(function(){ t.classList.remove("on"); }, 2000); }
  function prefs(){ var fs = get("fs"), th = get("theme"); fs && fs !== "0" ? root.dataset.fs = fs : delete root.dataset.fs; th ? root.dataset.theme = th : delete root.dataset.theme; }
  prefs();
  $("#fsBtn").onclick = function(){ var v = ((+get("fs") || 0) + 1) % 3; set("fs", String(v)); prefs(); toast(["标准字号","大字号","特大字号"][v]); };
  $("#themeBtn").onclick = function(){ var o = [null,"light","dark"], nx = o[(o.indexOf(get("theme")) + 1) % 3]; set("theme", nx); prefs(); toast({"null":"跟随系统","light":"浅色模式","dark":"深色模式"}[nx]); };
  window.addEventListener("scroll", function(){ $("#bar").classList.toggle("scrolled", scrollY > 4); }, {passive:true});
  $("#sIc").innerHTML = IC("search");

  var REG = window.REGISTRY.filter(function(r){ return r.status !== "draft"; });
  var live = {}; REG.forEach(function(r){ if (r.status === "live") live[r.id] = r; });

  /* 知识图谱入口 */
  $("#domains").innerHTML = REG.map(function(r){
    var on = r.status === "live";
    return '<a class="domain' + (on ? "" : " soon") + '" style="--cc:' + esc(r.color) + '"' + (on ? ' href="' + esc(r.id) + '/"' : "") + '>' +
      '<span class="ic">' + (r.ic ? IC(r.ic) : esc(r.icon)) + '</span><span class="tx"><b>' + esc(r.title) + (on ? "" : '<span class="tag">筹备中</span>') + '</b><span class="d">' + esc(r.desc) + '</span></span></a>';
  }).join("");

  /* 继续阅读：只读本机记录 */
  var last = null; try { last = JSON.parse(get("last") || "null"); } catch(e){}
  if (last && live[last.g]) {
    var read = 0; try { read = JSON.parse(get("read:" + last.g) || "[]").length; } catch(e){}
    $("#cont").innerHTML = '<a class="cont" href="' + esc(last.g) + '/#/k/' + esc(last.id) + '">' + IC("book") + '<span class="tx"><small>继续阅读 · ' + esc(last.gt || live[last.g].title) + (read ? " · 已读 " + read + " 条" : "") + '</small><b>' + esc(last.t) + '</b></span><svg class="chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></a>';
  }

  /* 我们怎么写 */
  var SITE = window.SITE_META || {};
  $("#how").innerHTML = [
    ["依据指南，每条附出处", "依据美国、欧洲与中国最新指南整理，每个知识点至少附 1 条可以点开核对的权威出处。"],
    ["如实标注审核状态", "内容由 AI 辅助整理。急救、用药等重点条目尚未经执业医师署名审核，页面会标出“待医生审核”。"],
    ["无广告、不设 cookie", "不放广告，不用 cookie 和统计脚本，本站页面不收集个人信息。阅读进度只保存在你自己的手机上。"],
    ["定期复核", "每半年按清单复核一次；有新指南时更新对应内容，并写明指南版本年份。"]
  ].map(function(x){ return '<li>' + IC("check") + '<div><b>' + x[0] + '</b><span>' + x[1] + '</span></div></li>'; }).join("");
  if (SITE.feedbackUrl) $("#foot").insertAdjacentHTML("beforeend", '<p><a href="' + esc(SITE.feedbackUrl) + '" target="_blank" rel="noopener">发现错误或看不懂？点这里反馈 →</a></p><p class="note">反馈会跳转到腾讯问卷（第三方网站，适用其隐私政策）。请勿填写姓名、电话、病历等个人信息。</p>');

  /* 全站搜索：索引由 node tools/validate.mjs 生成，第一次输入时才加载（不拖慢首屏） */
  var q = $("#gq"), loading = false;
  function load(){
    if (window.KG_SEARCH || loading) return; loading = true;
    var s = document.createElement("script"); s.src = "shared/search-index.js"; s.onload = run; s.onerror = function(){ $("#gres").innerHTML = '<p class="muted small">搜索暂时不可用，请进入下面的图谱浏览。</p>'; }; document.head.appendChild(s);
  }
  function run(){
    var v = q.value.trim().toLowerCase();
    if (!v) { $("#gres").innerHTML = ""; return; }
    var terms = v.split(/\s+/), S = window.KG_SEARCH;
    var hits = S.rows.filter(function(r){ if (!live[r[0]]) return false; var h = r.slice(2).join(" ").toLowerCase(); return terms.every(function(t){ return h.indexOf(t) >= 0; }); });
    if (!hits.length) { $("#gres").innerHTML = '<div class="empty">没有找到与“' + esc(q.value.trim()) + '”相关的知识点。试试“血压”“胸痛”“溶栓”。</div>'; return; }
    $("#gres").innerHTML = '<p class="muted small" style="margin:0 2px 8px">找到 ' + hits.length + ' 个结果' + (hits.length > 20 ? "，显示前 20 个" : "") + '</p><ul class="list">' + hits.slice(0, 20).map(function(r){
      return '<li><a href="' + esc(r[0]) + '/#/k/' + esc(r[1]) + '"><div class="tx"><div class="gname">' + esc(S.graphs[r[0]] || r[0]) + ' · ' + esc(r[5]) + '</div><div class="tt">' + esc(r[2]) + '</div><div class="ss">' + esc(r[4]) + '</div></div><svg class="chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></a></li>';
    }).join("") + '</ul>';
  }
  q.addEventListener("focus", load);
  q.addEventListener("input", function(){ window.KG_SEARCH ? run() : load(); });
})();
</script>
</body>
</html>
